<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usan Nuden Gunjee 💌</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Dancing+Script:wght@700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  background:
    linear-gradient(rgba(240,142,142,.45),rgba(247,158,158,.45)),
    url('background.jpg') no-repeat center center fixed;
  background-size:contain;
  font-family:'Poppins',sans-serif;
  color:#fff;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  text-shadow:0 2px 8px rgba(0,0,0,.6);
}

.container{text-align:center;animation:fadeIn 1.8s ease;}

h1{
  font-family:'Dancing Script',cursive;
  font-size:clamp(3rem,9vw,6rem);
  margin-bottom:20px;
}

.subtitle{font-size:clamp(1.3rem,4.5vw,2rem);margin-bottom:40px;}

.hearts{position:absolute;inset:0;pointer-events:none;}
.heart{
  position:absolute;
  font-size:1.8rem;
  animation:float 12s linear infinite;
  opacity:.8;
}

.btn-group{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;}

.btn{
  font-size:1.4rem;
  padding:18px 48px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-weight:700;
  transition:.3s;
}

.yes{background:#ff4d6d;color:#fff;}
.yes:hover{transform:scale(1.15) rotate(3deg);}
.no{background:#fff;color:#ff4d6d;border:3px solid #ff4d6d;}
.maybe{background:#ffd54f;color:#333;}

.message{
  font-size:2.2rem;
  font-weight:700;
  opacity:0;
  margin-top:40px;
  animation:heartbeat 1.5s infinite;
  transition:opacity 1.5s ease;
  text-align:center;
}

.visible{opacity:1;}

#yesGif{
  display:none;
  margin-top:30px;
  opacity:0;
  animation:fadeUp 2s ease forwards;
}

#yesGif img{
  max-width:80%;
  max-height:50vh;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

#maybeScreen{display:none;text-align:center;}

@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-15vh);}
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(40px);}
  to{opacity:1;}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.08);}
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div class="container" id="mainScreen">
  <h1>Usan nuden gunjdee</h1>
  <div class="subtitle">I've got something important to ask you 💕</div>

  <h1>Will you be my Балынчик?</h1>

  <div class="btn-group">
    <button class="btn yes" onclick="sayYes()">Yes!! 🥰</button>
    <button class="btn no" id="noBtn">No</button>
    <button class="btn maybe" onclick="showMaybe()">Not sure 🤔</button>
  </div>
</div>

<div class="message" id="loveMessage">
  Yayyyy!!! YOoOoOssu 💖<br>
  Love youuu💖<br>
</div>

<div id="yesGif">
  <img src="https://media.giphy.com/media/Zl7u48zLVFgLpRwq6f/giphy.gif">
</div>

<div id="maybeScreen">
  <h1>Take your time... but not too long 😏</h1>
  <img src="https://media.giphy.com/media/Y7RM7CetuHGOJUoXNv/giphy.gif"
       style="max-width:80%;border-radius:20px;">
  <br><br>
  <button class="btn yes" onclick="backToMain()">Think again 🥺💕</button>
</div>

<!-- Romantic music -->
<audio id="music" src="https://cdn.pixabay.com/audio/2022/03/15/audio_7c6b06d0fd.mp3"></audio>

<script>
function createHeart(){
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='♥';
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(Math.random()*1.4+1.2)+'rem';
  h.style.animationDuration=(Math.random()*8+9)+'s';
  hearts.appendChild(h);
  setTimeout(()=>h.remove(),16000);
}
setInterval(createHeart,400);

noBtn.onmouseover=()=>{
  noBtn.style.position='absolute';
  noBtn.style.left=Math.random()*(innerWidth-200)+'px';
  noBtn.style.top=Math.random()*(innerHeight-200)+'px';
};

function sayYes(){
  mainScreen.style.display='none';
  maybeScreen.style.display='none';
  loveMessage.classList.add('visible');
  yesGif.style.display='block';
  music.play();

  for(let i=0;i<80;i++){
    setTimeout(createHeart,i*50);
  }
}

function showMaybe(){
  mainScreen.style.display='none';
  maybeScreen.style.display='block';
}

function backToMain(){
  maybeScreen.style.display='none';
  mainScreen.style.display='block';
}
</script>

</body>
</html>
